AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FIDE Glicko scraping pipeline - Lambdas and Step Functions

Parameters:
  DataBucket:
    Type: String
    Default: fide-glicko
    Description: S3 bucket for scraped data and Lambda deployment artifacts

  PipelineConfigSsmParam:
    Type: String
    Default: /fide-glicko/pipeline/config
    Description: >
      SSM String parameter name (JSON object) for pipeline tuning. Create or edit
      in AWS Console (Parameter Store) without redeploying. Omitted execution
      input keys are filled from this object; see infra/step-function/README.md.

  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Email address notified when a pipeline execution fails or times out (for
      example after FideBlocked retries run out). Empty = topic only, no email.
      AWS sends a confirmation email that must be accepted once.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  EnsureRunNameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fide-glicko-ensure-run-name
      Runtime: python3.12
      CodeUri: .functions/ensure_run_name
      Handler: handlers.ensure_run_name.lambda_handler
      Timeout: 10
      MemorySize: 128
      Description: Normalize run_name for pipeline (prod=YYYY-MM, custom=required, test=default)
      Environment:
        Variables:
          PIPELINE_CONFIG_SSM_PARAM: !Ref PipelineConfigSsmParam
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PipelineConfigSsmParam}

  FederationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fide-glicko-federations
      Runtime: python3.12
      CodeUri: .functions/federations
      Handler: handlers.federations.lambda_handler
      Timeout: 60
      MemorySize: 128
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Fetch FIDE federation list

  TournamentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fide-glicko-tournaments
      Runtime: python3.12
      CodeUri: .functions/tournaments
      Handler: handlers.tournaments.lambda_handler
      Timeout: 900
      MemorySize: 192
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Fetch tournament IDs per federation

  # Shared Docker image: SAM tags builds lambdaimage-<hash>-data (logical ID LambdaImage = first alphabetically in this group).
  LambdaImage:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: docker/Dockerfile
      DockerTag: data
    Properties:
      FunctionName: fide-glicko-player-list
      PackageType: Image
      ImageConfig:
        Command:
          - handlers.player_list.lambda_handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Fetch FIDE player list XML

  LambdaImageDetailsChunk:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: docker/Dockerfile
      DockerTag: data
    Properties:
      FunctionName: fide-glicko-details-chunk
      PackageType: Image
      ImageConfig:
        Command:
          - handlers.details_chunk.lambda_handler
      Timeout: 900
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Scrape tournament details for a chunk

  LambdaImageReportsChunk:
    Type: AWS::Serverless::Function

    Metadata:
      DockerContext: .
      Dockerfile: docker/Dockerfile
      DockerTag: data
    Properties:
      FunctionName: fide-glicko-reports-chunk
      PackageType: Image
      ImageConfig:
        Command:
          - handlers.reports_chunk.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Scrape tournament reports for a chunk

  LambdaImageMergeChunks:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: docker/Dockerfile
      DockerTag: data
    Properties:
      FunctionName: fide-glicko-merge-chunks
      PackageType: Image
      ImageConfig:
        Command:
          - handlers.merge_chunks.lambda_handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Merge detail and report chunks into single parquet files

  LambdaImageValidate:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: docker/Dockerfile
      DockerTag: data
    Properties:
      FunctionName: fide-glicko-validate
      PackageType: Image
      ImageConfig:
        Command:
          - handlers.validate.lambda_handler
      Timeout: 300
      MemorySize: 1536
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Validate pipeline data consistency

  SplitIdsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fide-glicko-split-ids
      Runtime: python3.12
      CodeUri: .functions/split_ids
      Handler: handlers.split_ids.lambda_handler
      Timeout: 120
      MemorySize: 128
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      Description: Split tournament IDs into chunks

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fide-glicko-orchestrator
      Runtime: python3.12
      CodeUri: .functions/orchestrator
      Handler: handlers.orchestrator.lambda_handler
      Timeout: 60
      MemorySize: 128
      Description: Hourly backfill orchestrator — finds earliest incomplete month and starts pipeline
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PIPELINE_STATE_MACHINE_ARN: !Ref PipelineStateMachine
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - states:ListExecutions
                - states:StartExecution
                - states:DescribeExecution
              Resource: !Ref PipelineStateMachine
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(2 hours)"
            Description: "Backfill orchestrator — disabled by default, enable manually when ready"
            Enabled: false

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: fide-glicko-pipeline
      DefinitionUri: infra/step-function/pipeline.asl.json
      DefinitionSubstitutions:
        EnsureRunNameFunctionArn: !GetAtt EnsureRunNameFunction.Arn
        FederationsFunctionArn: !GetAtt FederationsFunction.Arn
        TournamentsFunctionArn: !GetAtt TournamentsFunction.Arn
        PlayerListFunctionArn: !GetAtt LambdaImage.Arn
        SplitIdsFunctionArn: !GetAtt SplitIdsFunction.Arn
        DetailsChunkFunctionArn: !GetAtt LambdaImageDetailsChunk.Arn
        ReportsChunkFunctionArn: !GetAtt LambdaImageReportsChunk.Arn
        MergeChunksFunctionArn: !GetAtt LambdaImageMergeChunks.Arn
        ValidateFunctionArn: !GetAtt LambdaImageValidate.Arn
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt EnsureRunNameFunction.Arn
                - !GetAtt FederationsFunction.Arn
                - !GetAtt TournamentsFunction.Arn
                - !GetAtt LambdaImage.Arn
                - !GetAtt SplitIdsFunction.Arn
                - !GetAtt LambdaImageDetailsChunk.Arn
                - !GetAtt LambdaImageReportsChunk.Arn
                - !GetAtt LambdaImageMergeChunks.Arn
                - !GetAtt LambdaImageValidate.Arn

  PipelineAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: fide-glicko-pipeline-alerts

  PipelineAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PipelineAlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineAlertsTopic

  PipelineAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref PipelineAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # A failed run should never sit unnoticed (e.g. FIDE blocking us for >12h).
  PipelineFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: fide-glicko-pipeline-failed
      Description: Notify when a pipeline execution fails, times out or is aborted
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          status:
            - FAILED
            - TIMED_OUT
            - ABORTED
          stateMachineArn:
            - !Ref PipelineStateMachine
      Targets:
        - Id: alerts-topic
          Arn: !Ref PipelineAlertsTopic

  # Live view of a scrape: progress, request rate and FIDE health.
  # Metrics come from the chunk_summary EMF lines (src/scraper/metrics.py).
  ScrapeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: fide-glicko-scrape
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Throughput (per hour)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [
                  ["FideGlicko", "requests", {"label": "FIDE requests"}],
                  ["FideGlicko", "progress", {"label": "tournaments saved"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "FIDE health (per hour) - any block is worth a look",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [
                  ["FideGlicko", "blocked", {"label": "invocations stopped by block", "color": "#d62728"}],
                  ["FideGlicko", "block_signals", {"label": "block signals"}],
                  ["FideGlicko", "strain_errors", {"label": "strain errors (5xx, read timeouts)"}],
                  ["FideGlicko", "slowdowns", {"label": "automatic slowdowns"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Request rate at end of invocation (req/s)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 900,
                "metrics": [
                  ["FideGlicko", "final_rate", {"stat": "Minimum", "label": "min"}],
                  ["FideGlicko", "final_rate", {"stat": "Average", "label": "avg"}]
                ],
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 8, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "FIDE response time, median per invocation (s)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 900,
                "metrics": [
                  ["FideGlicko", "latency_p50_s", {"stat": "Average", "label": "avg"}],
                  ["FideGlicko", "latency_p50_s", {"stat": "Maximum", "label": "max"}]
                ],
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Pipeline executions",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [
                  ["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${PipelineStateMachine}", {"color": "#2ca02c"}],
                  ["AWS/States", "ExecutionsFailed", "StateMachineArn", "${PipelineStateMachine}", {"color": "#d62728"}]
                ]
              }
            },
            {
              "type": "log", "x": 0, "y": 12, "width": 24, "height": 8,
              "properties": {
                "title": "Recent chunk invocations",
                "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '/aws/lambda/fide-glicko-details-chunk' | SOURCE '/aws/lambda/fide-glicko-reports-chunk' | filter event = 'chunk_summary' | fields @timestamp, run_name, kind, chunk, stopped, progress, remaining, failed, requests, final_rate, slowdowns, block_signals, latency_p50_s, error | sort @timestamp desc | limit 50"
              }
            }
          ]
        }

Outputs:
  PipelineStateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref PipelineStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-PipelineArn"

  PipelineAlertsTopicArn:
    Description: SNS topic for pipeline failure alerts
    Value: !Ref PipelineAlertsTopic

  ScrapeDashboardUrl:
    Description: CloudWatch dashboard for scrape progress and FIDE health
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=fide-glicko-scrape"
